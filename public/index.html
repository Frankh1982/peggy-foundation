<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PEG • WS Chat (KDN + CALL + Learn)</title>
<style>
  :root { --bg:#0b0c10; --card:#15171c; --text:#e6e7eb; --muted:#9aa0aa; --accent:#5aa9e6; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; display:grid; grid-template-columns: 1fr 360px; gap:16px; }
  .col { min-width: 0; }
  .chat { background: var(--card); border-radius: 16px; padding: 16px; min-height: 70vh; overflow: auto; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
  .msg { display: flex; gap: 12px; padding: 10px 8px; border-radius: 12px; margin: 8px 0; }
  .msg.user { background: rgba(90,169,230,.08); }
  .msg.assistant { background: rgba(255,255,255,.04); }
  .role { font-weight: 600; color: var(--muted); min-width: 84px; }
  .content { white-space: pre-wrap; }
  .row { display:flex; gap:10px; margin-top:12px; }
  textarea { flex:1; resize: vertical; min-height: 56px; padding: 12px; border-radius: 12px; border: 1px solid #2a2f36; background: #0f1216; color: var(--text); }
  button { padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: #0b0c10; font-weight: 700; cursor: pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .top { display:flex; justify-content: space-between; align-items:center; margin-bottom:10px; color: var(--muted); }

  .panel { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
  .kv { display:grid; grid-template-columns: 120px 1fr; gap:6px 10px; margin: 6px 0; font-size: 13px; }
  .kv b { color: var(--muted); font-weight:600; }
  .gap-card, .call-card { padding:10px; border:1px dashed #2a2f36; border-radius:10px; margin:10px 0; }
  .monosmall { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="top">
        <div>PEG Socket Chat • KDN baseline</div>
        <div id="status">disconnected</div>
      </div>
      <div id="chat" class="chat"></div>
      <div class="row">
        <textarea id="input" placeholder="Type a message…"></textarea>
        <button id="send">Send</button>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <b>Inspector</b>
        <div class="kv"><b>KDN state</b><div id="kdn_state">—</div></div>
        <div class="kv"><b>Reason</b><div id="kdn_reason" class="monosmall">—</div></div>
        <div class="kv"><b>Tokens (p/c/t)</b><div id="tok" class="monosmall">—</div></div>
        <div class="kv"><b>Server build</b><div id="build" class="monosmall">—</div></div>
        <div class="kv"><b>Call policy</b><div id="policy" class="monosmall">—</div></div>
        <div style="margin-top:8px;"><b>Learning (last 20)</b></div>
        <pre id="learn" class="monosmall" style="white-space:pre-wrap;background:#0f1216;padding:8px;border-radius:8px;min-height:60px;">—</pre>
        <div style="margin-top:8px;"><b>Events</b></div>
        <pre id="events" class="monosmall" style="white-space:pre-wrap;background:#0f1216;padding:8px;border-radius:8px;min-height:60px;">—</pre>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js?v=14"></script>
</body>
</html>
